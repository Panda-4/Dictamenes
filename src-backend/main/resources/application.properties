spring.application.name=dictamenes-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_Dictamenes?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}

# Perfil activo — por defecto "dev", en Render se configura "prod"
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Puerto del backend
server.port=${SERVER_PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:RGljdGFtZW5lc0dFTS1TdXBlclNlY3JldEtleTIwMjYtUXVlTmFkaWVQdWVkZUFkaXZpbmFy}
jwt.expiration=${JWT_EXPIRATION:86400000}

