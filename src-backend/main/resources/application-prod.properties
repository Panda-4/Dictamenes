# === Perfil de PRODUCCIÓN ===
# Validate impide que Hibernate modifique el schema automáticamente
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# En producción JWT_SECRET DEBE ser provisto como variable de entorno
# No usar el valor por defecto del application.properties base

# Seguridad de errores - no incluir trazas de pila ni detalles sensibles al cliente
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Soporte para proxies inversos (SSL Termination)
server.forward-headers-strategy=FRAMEWORK

# Ocultar página de error genérica de Spring Boot (White Label Error Page)
server.error.whitelabel.enabled=false

# Cambiar nombre por defecto de cookie de sesión (oculta JSESSIONID)
server.servlet.session.cookie.name=SESSID
